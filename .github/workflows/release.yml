name: Release

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Update existing release?'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Version and Zip Info
        id: info
        run: |
          VERSION_NUM=$(grep -oP 'local ModVersion = "\K[^"]+' Scripts/main.lua || true)
          if [ -z "$VERSION_NUM" ]; then
            echo "::error::Could not find ModVersion in Scripts/main.lua!"
            exit 1
          fi
          MOD_VERSION="v${VERSION_NUM}"

          REPO_NAME="${{ github.event.repository.name }}"

          ZIP_NAME="${REPO_NAME}.zip"
          MOD_DIR_NAME="${REPO_NAME}"

          echo "Detected Version: $MOD_VERSION"
          echo "Detected Zip: $ZIP_NAME"
          echo "Detected Dir Name: $MOD_DIR_NAME"

          echo "version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "mod_dir_name=$MOD_DIR_NAME" >> $GITHUB_OUTPUT

      - name: Check for Existing Tags
        id: check_tags
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=${{ steps.info.outputs.version }}
          FORCE=${{ inputs.force_update }}

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            if [ "$FORCE" == "true" ]; then
              echo "Tag $VERSION exists, but 'Force Update' is ON. Proceeding..."
            else
              echo "::error::Tag $VERSION already exists! Enable 'Force Update' to overwrite."
              exit 1
            fi
          fi

      - name: Prepare Zip
        run: |
          ZIP_NAME=${{ steps.info.outputs.zip_name }}
          MOD_DIR_NAME=${{ steps.info.outputs.mod_dir_name }}

          mkdir -p build/"$MOD_DIR_NAME"

          rsync -av ./ build/"$MOD_DIR_NAME"/ \
            --exclude '.git*' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '*.zip'

          cd build
          zip -r "../$ZIP_NAME" "$MOD_DIR_NAME"

      - name: Create or Update Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          VERSION=${{ steps.info.outputs.version }}
          FORCE=${{ inputs.force_update }}

          if [ "$FORCE" == "true" ]; then
            git tag -f "$VERSION"
            git push -f origin "$VERSION"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.zip_name }}-build
          path: ${{ steps.info.outputs.zip_name }}
          retention-days: 5

      - name: Determine Draft Status
        id: draft_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          IS_DRAFT="true"
          if ExistingJson=$(gh release view "$VERSION" --repo "${{ github.repository }}" --json isDraft 2>/dev/null); then
            IS_DRAFT=$(echo "$ExistingJson" | jq -r '.isDraft')
            echo "Existing release found on GitHub. Preserving draft status: $IS_DRAFT"
          else
            echo "No existing release found on GitHub. Creating initial release as draft."
          fi
          echo "is_draft=$IS_DRAFT" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.info.outputs.version }}
          name: ${{ steps.info.outputs.version }}
          artifacts: ${{ steps.info.outputs.zip_name }}
          allowUpdates: ${{ inputs.force_update || github.event_name == 'push' }}
          omitBodyDuringUpdate: ${{ inputs.force_update == true }}
          removeArtifacts: true
          draft: ${{ steps.draft_status.outputs.is_draft == 'true' }}
          generateReleaseNotes: ${{ inputs.force_update != true }}
          makeLatest: true
          bodyFile: ".github/release_notes.md"

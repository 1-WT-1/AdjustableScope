[General]
; Set to true to print detailed debug logs to console (default: false).
Debug = true

[Keybinds]
; Use Unreal Engine / Windows key names (e.g., OEM_PLUS, OEM_MINUS, PAGE_UP, PAGE_DOWN, F1, CAPS_LOCK, XBUTTON_ONE, XBUTTON_TWO)
; Leave a key entry blank to disable that hotkey.

; Dedicated keys (always control the same function)
DedicatedZoomInKey  = OEM_PLUS   ; (+) Plus key
DedicatedZoomOutKey = OEM_MINUS  ; (-) Minus key
DedicatedZeroUpKey  = PAGE_UP    ; Page Up key
DedicatedZeroDownKey = PAGE_DOWN ; Page Down key

; Dual-use keys (mode toggled by DualSwitchKey)
; Caps Lock OFF -> controls Zoom. Caps Lock ON -> controls Zero.
DualUpKey     = XBUTTON_TWO ; Mouse 5 (Forward thumb button)
DualDownKey   = XBUTTON_ONE ; Mouse 4 (Back thumb button)
DualSwitchKey = CAPS_LOCK   ; Caps Lock key
ClearKey      = F1          ; F1 key (resets zoom and zeroing)

; true = remember zoom/zero after leaving ADS. false = reset on every ADS exit.
SaveStateOnADS = true

[ZoomSettings]
; Set to true to use preset ZoomStages below.
; Set to false to use continuous smooth zoom (DynamicZoomStep).
UseSteppedZoom = true

; Continuous dynamic zoom settings (used only when UseSteppedZoom = false):
DynamicZoomStep = 1.0
DynamicMinZoom  = 0.5
DynamicMaxZoom  = 32.0

[ZoomStages]
; Set the zoom levels for different weapon types.
; The format is: Maximum Base Magnification = Level 1, Level 2, Level...N
; The mod reads the base magnification of your equipped weapon.
; It finds the first row where the base magnification is less than or equal to the left number.
; It uses the numbers on the right as your zoom multipliers.

; Weapons with a base magnification between 1.0 and 1.8 (Iron Sights and Red Dots).
1.8 = 1.0, 1.25

; Weapons with a base magnification between 1.9 and 5.0 (Medium Power Scopes).
5.0 = 0.8, 1.0, 1.25, 1.5

; Weapons with a base magnification of 5.1 or more (High Power Sniper Scopes).
99.0 = 0.5, 0.8, 1.0, 1.25, 1.5, 1.75, 2.0
; for example most of these scopes are 8x so you would get: 4x, 6.4x, 8x, 10x, 12x, 14x, 16x

[ZeroStages]
; Set the zero distances for different weapon types.
; The format is: Maximum Base Magnification = Distance 1, Distance 2, Distance...N
; The mod reads the base magnification of your equipped weapon.
; It finds the first row where the base magnification is less than or equal to the left number.
; It uses the numbers on the right as your zero distances in meters.
; Use 0 to disable zeroing and use the default game value.

; Weapons with a base magnification between 1.0 and 1.8 (Iron Sights and Red Dots).
1.8 = 0, 50, 100, 200

; Weapons with a base magnification between 1.9 and 5.0 (Medium Power Scopes).
5.0 = 0, 100, 200, 300, 400

; Weapons with a base magnification of 5.1 or more (High Power Sniper Scopes).
99.0 = 0, 100, 200, 300, 400, 500, 600, 800, 1000

[ZeroingSettings]
; Set to true to enable bullet zeroing (elevation adjustment).
EnableZeroing = true

; Ignore self-propelled rockets/missiles so they don't skyrocket
IgnoreRockets = true
; Max vertical pitch angle limit (in degrees)
MaxPitchAngle = 45.0

[Audio]
; Play tactile click sound on zoom / zeroing adjustment
EnableSound = true
SoundVolume = 0.5

[HUD]
; Set to true to show scope zoom/zero info on screen during ADS (default: true).
ShowHUD = true

; Set to true to show scope info even when no HUD is equipped in-game (default: true).
; Set to false to hide scope info unless a HUD is equipped in-game.
ShowWithoutEquippedHUD = true
